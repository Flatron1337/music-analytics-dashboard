services:
  - type: web
    name: music-analytics-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u main.py
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

